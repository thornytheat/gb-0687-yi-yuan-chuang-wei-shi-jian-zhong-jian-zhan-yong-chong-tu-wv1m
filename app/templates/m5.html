{% extends "base.html" %}{% block content %}<div class="schedule"><section class="panel"><div class="panel__head"><h2>床日占用</h2><span>24 h / 格</span></div><div class="days">{% for x in result.calendar %}<div><code>{{x.date}} / {{x.bed}}</code><div><i style="width:{{[x.minutes|float/14.4,100]|min}}%"></i></div><b>{{'%.0f'|format(x.minutes|float)}} min</b></div>{% endfor %}</div></section><section class="panel"><div class="panel__head"><h2>日历明细</h2></div>{{rows(data.rows,['date','ward','bed','minutes','state'])}}</section></div>{% endblock %}
