{% extends "base.html" %}{% block content %}<div class="schedule"><section class="panel"><div class="panel__head"><h2>迟到补传</h2><span>{{data.rows|length}} 行</span></div>{{rows(data.rows,['id','patient','time','late_minutes','state'])}}</section><section class="panel"><div class="panel__head"><h2>补传复核</h2><span>V{{result.version}}</span></div><form id="review" data-run="{{result.manifest.run_id}}" data-version="{{result.version}}"><label>决定<select name="decision"><option>通过</option><option>退回</option></select></label><button class="action fill">提交复核</button></form><div class="watermark"><small>事件水位 UTC</small><code>{{result.audit.watermark}}</code></div>{% for item in history %}<a class="past" href="/m/7?run={{item.id}}">{{item.id[:12]}} / {{item.review}}</a>{% endfor %}</section></div>{% endblock %}
